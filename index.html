<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランニングログ</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap');

  :root{
    --asphalt:#171a17;
    --asphalt-2:#20241f;
    --chalk:#f1efe6;
    --chalk-dim:#a9ada2;
    --signal:#e8b92e;
    --sage:#7c9473;
    --line:#33372f;
    --danger:#c76a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--asphalt);
    color:var(--chalk);
    font-family:'IBM Plex Sans JP','IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--sage);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(32px,7vw,44px);
    letter-spacing:.01em;
    margin:0;
    line-height:1.05;
  }

  .scoreboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin:24px 0 32px;
  }
  .score-cell{
    background:var(--asphalt-2);
    padding:16px 14px;
  }
  .score-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--chalk-dim);
    margin-bottom:8px;
  }
  .score-value{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:clamp(20px,5vw,28px);
    color:var(--signal);
    font-variant-numeric:tabular-nums;
  }
  .score-value small{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--chalk-dim);
    margin-left:2px;
  }

  .panel{
    border:1px solid var(--line);
    background:var(--asphalt-2);
    padding:20px;
    margin-bottom:20px;
  }
  .panel h2{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 16px;
    color:var(--chalk);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{
    content:'';
    width:10px;height:10px;
    background:var(--signal);
  }

  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--chalk-dim);
  }
  input{
    background:var(--asphalt);
    border:1px solid var(--line);
    color:var(--chalk);
    padding:10px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    outline:none;
  }
  input:focus{border-color:var(--signal);}
  input::placeholder{color:#5c6055;}

  .add-btn{
    grid-column:1/-1;
    background:var(--signal);
    color:var(--asphalt);
    border:none;
    padding:12px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.05em;
    text-transform:uppercase;
    cursor:pointer;
    margin-top:4px;
    transition:filter .15s;
  }
  .add-btn:hover{filter:brightness(1.08);}
  .add-btn:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}

  .chart-wrap{overflow-x:auto;}
  svg{display:block;min-width:600px;width:100%;}
  .axis-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    fill:var(--chalk-dim);
  }
  .grid-line{stroke:var(--line);stroke-width:1;}
  .pace-line{fill:none;stroke:var(--sage);stroke-width:2;}
  .pace-dot{fill:var(--signal);}
  .pace-dot:hover{fill:var(--chalk);}
  .empty{
    color:var(--chalk-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:30px 0;
    text-align:center;
  }

  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--chalk-dim);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
  td.pace{color:var(--signal);}
  .del{
    background:none;border:none;color:var(--danger);cursor:pointer;
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 6px;
  }
  .del:hover{text-decoration:underline;}

  .tooltip{
    position:absolute;
    background:var(--asphalt);
    border:1px solid var(--signal);
    padding:6px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    pointer-events:none;
    white-space:nowrap;
    transform:translate(-50%,-110%);
    display:none;
  }
  .chart-outer{position:relative;}

  @media (max-width:480px){
    form{grid-template-columns:1fr;}
    .scoreboard{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Run Log — 走行記録</div>
    <h1>ランニングログ</h1>
  </header>

  <div class="scoreboard">
    <div class="score-cell">
      <div class="score-label">総走行回数</div>
      <div class="score-value" id="statCount">0<small>回</small></div>
    </div>
    <div class="score-cell">
      <div class="score-label">総距離</div>
      <div class="score-value" id="statDist">0.0<small>km</small></div>
    </div>
    <div class="score-cell">
      <div class="score-label">ベストペース</div>
      <div class="score-value" id="statPace">—<small>/km</small></div>
    </div>
  </div>

  <div class="panel">
    <h2>記録を追加</h2>
    <form id="runForm">
      <div class="field">
        <label for="date">日付</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="distance">距離 (km)</label>
        <input type="number" id="distance" step="0.01" min="0.01" placeholder="1.50" value="1.5" required>
      </div>
      <div class="field">
        <label for="minutes">タイム 分</label>
        <input type="number" id="minutes" min="0" placeholder="25" required>
      </div>
      <div class="field">
        <label for="seconds">タイム 秒</label>
        <input type="number" id="seconds" min="0" max="59" placeholder="30" required>
      </div>
      <button type="submit" class="add-btn">記録する</button>
    </form>
  </div>

  <div class="panel">
    <h2>タイム推移</h2>
    <div class="chart-outer">
      <div class="chart-wrap"><svg id="chartTime" viewBox="0 0 600 220"></svg></div>
      <div class="tooltip" id="tooltipTime"></div>
    </div>
  </div>

  <div class="panel">
    <h2>ペース推移</h2>
    <div class="chart-outer">
      <div class="chart-wrap"><svg id="chart" viewBox="0 0 600 220"></svg></div>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <div class="panel">
    <h2>記録一覧</h2>
    <div id="tableWrap"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'running-log:entries';
let runs = [];

function paceMinPerKm(distKm, totalSec){
  return totalSec / 60 / distKm;
}
function formatPace(p){
  if(!isFinite(p)) return '—';
  const m = Math.floor(p);
  const s = Math.round((p-m)*60);
  return m + ':' + String(s).padStart(2,'0');
}
function formatDate(d){
  const dt = new Date(d+'T00:00:00');
  return (dt.getMonth()+1) + '/' + dt.getDate();
}

// ここにLINE Developersで発行されたLIFF IDを入れる
const LIFF_ID = '2011161733-H7ZGrXc5';

// ここにFirebaseコンソールの「マイアプリ」で取得したfirebaseConfigを貼る
const firebaseConfig = {
  apiKey: 'AIzaSyDOcDL_9aFbPHg5_X7ij5ZmqDKmRIo-ljs',
  authDomain: 'kyuhoji-running.firebaseapp.com',
  databaseURL: 'https://kyuhoji-running-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'kyuhoji-running',
  storageBucket: 'kyuhoji-running.firebasestorage.app',
  messagingSenderId: '710383054199',
  appId: '1:710383054199:web:bf8f77e39ee2b94a8fc572'
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let userId = null;
let userRef = null;

async function initLiff(){
  try{
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn() && !liff.isInClient()){
      liff.login();
      return;
    }
    const profile = await liff.getProfile();
    userId = profile.userId;
    userRef = db.ref('runs/' + userId);
  }catch(e){
    console.error('LIFF init failed', e);
  }
}

function load(){
  if(!userRef){
    // LIFF未初期化(通常ブラウザでの確認時など)はローカル空表示のみ
    runs = [];
    render();
    return;
  }
  userRef.on('value', (snapshot)=>{
    const data = snapshot.val();
    runs = data ? Object.values(data) : [];
    render();
  });
}

function save(){
  if(!userRef) return;
  const obj = {};
  runs.forEach(r => { obj[r.id] = r; });
  userRef.set(obj);
}

function render(){
  const sorted = [...runs].sort((a,b)=> new Date(a.date) - new Date(b.date));

  // stats
  document.getElementById('statCount').innerHTML = runs.length + '<small>回</small>';
  const totalDist = runs.reduce((s,r)=>s+r.distance,0);
  document.getElementById('statDist').innerHTML = totalDist.toFixed(1) + '<small>km</small>';
  if(runs.length){
    const best = Math.min(...runs.map(r=>paceMinPerKm(r.distance,r.totalSec)));
    document.getElementById('statPace').innerHTML = formatPace(best) + '<small>/km</small>';
  } else {
    document.getElementById('statPace').innerHTML = '—<small>/km</small>';
  }

  renderChart('chart','tooltip', sorted, r => paceMinPerKm(r.distance, r.totalSec), formatPace, '/km');
  renderChart('chartTime','tooltipTime', sorted, r => r.totalSec/60, formatPace, '');
  renderTable(sorted);
}

function renderChart(svgId, tooltipId, sorted, valueFn, formatFn, unitSuffix){
  const svg = document.getElementById(svgId);
  const tooltip = document.getElementById(tooltipId);
  svg.innerHTML = '';

  if(sorted.length === 0){
    svg.innerHTML = '<text x="300" y="110" text-anchor="middle" class="axis-label" font-size="13">まだ記録がありません</text>';
    return;
  }

  const W = 600, H = 220, padL = 46, padR = 20, padT = 16, padB = 30;
  const values = sorted.map(valueFn);
  const minP = Math.min(...values), maxP = Math.max(...values);
  const range = (maxP - minP) || 1;
  const yFor = p => padT + (H-padT-padB) * (1 - (p-minP+range*0.15)/(range*1.3));
  const xFor = i => sorted.length===1 ? (padL+(W-padL-padR)/2) : padL + (W-padL-padR)*(i/(sorted.length-1));

  const ns = 'http://www.w3.org/2000/svg';
  // grid lines
  for(let g=0; g<=3; g++){
    const y = padT + (H-padT-padB)*g/3;
    const line = document.createElementNS(ns,'line');
    line.setAttribute('x1',padL); line.setAttribute('x2',W-padR);
    line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('class','grid-line');
    svg.appendChild(line);
  }

  // path
  let d = '';
  sorted.forEach((r,i)=>{
    const x = xFor(i), y = yFor(values[i]);
    d += (i===0?'M':'L') + x + ' ' + y + ' ';
  });
  const path = document.createElementNS(ns,'path');
  path.setAttribute('d', d.trim());
  path.setAttribute('class','pace-line');
  svg.appendChild(path);

  // dots + x labels (thin out labels if many)
  const labelStep = Math.ceil(sorted.length/8);
  sorted.forEach((r,i)=>{
    const x = xFor(i), y = yFor(values[i]);
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',4.5);
    c.setAttribute('class','pace-dot');
    c.style.cursor='pointer';
    c.addEventListener('mouseenter', ()=>{
      tooltip.style.display='block';
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.textContent = formatDate(r.date) + '  ' + r.distance + 'km  ' + formatFn(values[i]) + unitSuffix;
    });
    c.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });
    svg.appendChild(c);

    if(i % labelStep === 0 || i===sorted.length-1){
      const t = document.createElementNS(ns,'text');
      t.setAttribute('x',x); t.setAttribute('y',H-10);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('class','axis-label');
      t.textContent = formatDate(r.date);
      svg.appendChild(t);
    }
  });

  // y labels (min/max)
  const tMax = document.createElementNS(ns,'text');
  tMax.setAttribute('x',6); tMax.setAttribute('y',yFor(maxP)+4);
  tMax.setAttribute('class','axis-label');
  tMax.textContent = formatFn(maxP);
  svg.appendChild(tMax);

  const tMin = document.createElementNS(ns,'text');
  tMin.setAttribute('x',6); tMin.setAttribute('y',yFor(minP)+4);
  tMin.setAttribute('class','axis-label');
  tMin.textContent = formatFn(minP);
  svg.appendChild(tMin);
}

function renderTable(sorted){
  const wrap = document.getElementById('tableWrap');
  if(sorted.length===0){
    wrap.innerHTML = '<div class="empty">記録を追加すると、ここに一覧が表示されます</div>';
    return;
  }
  const rows = [...sorted].reverse().map(r=>{
    const pace = paceMinPerKm(r.distance, r.totalSec);
    const m = Math.floor(r.totalSec/60), s = r.totalSec%60;
    return `<tr>
      <td>${formatDate(r.date)}</td>
      <td>${r.distance.toFixed(2)}km</td>
      <td>${m}:${String(s).padStart(2,'0')}</td>
      <td class="pace">${formatPace(pace)}/km</td>
      <td><button class="del" data-id="${r.id}">削除</button></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table>
    <thead><tr><th>日付</th><th>距離</th><th>タイム</th><th>ペース</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
  wrap.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      runs = runs.filter(r=>r.id !== btn.dataset.id);
      save();
      render();
    });
  });
}

document.getElementById('runForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const date = document.getElementById('date').value;
  const distance = parseFloat(document.getElementById('distance').value);
  const minutes = parseInt(document.getElementById('minutes').value || '0',10);
  const seconds = parseInt(document.getElementById('seconds').value || '0',10);
  if(!date || !distance || (minutes===0 && seconds===0)) return;

  runs.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    date, distance,
    totalSec: minutes*60 + seconds
  });
  save();
  render();
  e.target.reset();
});

(async ()=>{
  await initLiff();
  load();
})();
</script>
</body>
</html>
